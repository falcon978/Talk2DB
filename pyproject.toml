[project]
name = "talk2db"
version = "0.1.0"
description = "Conversational Text-to-SQL Agent for Agricultural Data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
]

[project.optional-dependencies]
api = [
    "fastapi",
    "uvicorn",
    "langgraph",
    "sqlglot",
    "asyncpg",
    "pandas",
    "openpyxl",
    "redis",
    "langchain-ollama",
    "langgraph-checkpoint-postgres",
    "psycopg-binary",
    "nest-asyncio",
]
ui = [
    "streamlit",
    "requests",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "eval"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["talk2db"]
